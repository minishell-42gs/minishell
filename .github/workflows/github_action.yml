name: Minishell CI

on:
  push:
    branches:
      - main
      - story
  pull_request:
    branches:
      - main
      - story

permissions:
  contents: read

jobs:
  norminette:
    name: Norminette Check
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Norminette 설치
        run: python3 -m pip install norminette==3.3.59

      - name: Norm 검사
        # 3.3.59 는 과제가 허용하는 시그널 전역 변수 1개에도 Notice 를 내고 exit 1 을
        # 반환한다. 평가 기준과 같게 Error 줄이 있을 때만 실패시킨다.
        run: |
          norminette Assignments > norm.log || true
          cat norm.log
          ! grep -q '^Error' norm.log

  build:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: readline 설치
        run: sudo apt-get update && sudo apt-get install -y libreadline-dev

      - name: make 확인
        run: make -C Assignments fclean && make -C Assignments

      - name: 단위 테스트와 파이프 실패 경로
        run: make -C Tests test

      - name: 통합 테스트
        run: make -C Tests integration
