name: Close Linked Issue on Story Merge

on:
  pull_request:
    types: [closed]

jobs:
  close-issue:
    # PR이 실제로 머지되었고, 대상 브랜치(base branch) 이름이 story/로 시작하는 경우에만 실행
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.base.ref, 'story/')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Close linked issue
        uses: peter-evans/close-issue@v3
        with:
          # PR 번호를 전달하면 action 내부에서 Linked Issue를 추적하여 Close 처리합니다.
          issue-number: ${{ github.event.pull_request.number }}
          comment: "Closed automatically via PR merge to `${{ github.event.pull_request.base.ref }}`."